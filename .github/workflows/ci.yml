name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:
    branches: [ '**' ]

# One group per ref, so a second push cancels the run it superseded on that branch only and
# no other branch is touched. The default branch is excluded: `main` is protected and every
# commit that lands there keeps a completed run of its own.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
  lint_test:
    name: Lint and Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v7

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/pyproject.toml','**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[lite,dev]
          # Ensure numpy and OpenCV are available for vision tests (installed separately
          # so we avoid pulling the entire `full` extras which may include heavy native
          # packages not needed for CI).
          pip install numpy opencv-contrib-python

      - name: Lint (ruff)
        run: |
          python -m ruff check src

      - name: Run tests
        env:
          PYTHONPATH: src
        run: |
          pytest -q

  mypy:
    name: Type checks (mypy)
    runs-on: ubuntu-latest
    needs: lint_test
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps for mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e .[lite,dev]
      - name: Run mypy
        run: |
          mypy src --ignore-missing-imports

  package:
    name: Packaging build
    runs-on: ubuntu-latest
    needs: lint_test
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install build tool
        run: |
          python -m pip install --upgrade pip
          pip install build
      - name: Build sdist and wheel
        run: |
          python -m build --sdist --wheel

